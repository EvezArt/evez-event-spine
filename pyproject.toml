[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "evez-event-spine"
version = "1.0.0"
description = "Append-only hash-linked event log."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Steven Crawford-Maggard", email = "steven@evez-os.ai"}]
keywords = ["event-sourcing", "spine", "append-only", "immutable", "evez"]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]
[project.urls]
Homepage = "https://evez-os.ai"
Repository = "https://github.com/EvezArt/evez-event-spine"
[project.scripts]
evez-spine = "evez_event_spine.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
